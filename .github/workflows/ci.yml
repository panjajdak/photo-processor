name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/PhotoProcessor.sln

      - name: Build
        run: dotnet build src/PhotoProcessor.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/PhotoProcessor.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/PhotoProcessor.Console -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg
